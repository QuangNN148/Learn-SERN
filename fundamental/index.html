<style>
    button {
        background-color: rgb(121, 16, 219);
        color: rgb(255, 255, 255);
        font-size: 20px;
        padding: 10px 20px;
        border: 1px solid rgba(255, 250, 250, 0);
        border-radius: 4px;
        cursor: pointer;
    }

    .first-class {
        color: rgb(255, 72, 0);
        font-size: 50px;
    }

    .second-class {
        color: rgb(0, 255, 157);
        font-size: 50px;
    }
</style>

<body>
    <p id="nnq-title" style="color: rgb(111, 0, 255);font-size: 100px;display: none;">NNQ</p>
    <button onclick="document.getElementById('nnq-title').style.display = 'block';">
        Who is your father?
    </button>
    <div>
        <h1 class="first-class">NNQ TeamFight Tactics Challenge</h1>
        <img src="./image/tft1.jpg" alt="NNQ" width="400px" height="400px">
        <img src="./image/tft2.jpg" alt="NNQ" width="400px" height="400px">
    </div>
    <div>
        <h1 class="second-class">NNQ LQ Mobile Challenge</h1>
        <img src="./image/lq1.jpg" alt="NNQ" width="600px" height="300px">
        <img src="./image/lq2.jpg" alt="NNQ" width="600px" height="300px">
    </div>
